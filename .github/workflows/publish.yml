name: Publish slint-webos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the release version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'CRATE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build the webOS SDK image
        run: docker build -t slint-webos-build .
      - name: Bundle SDL and package the crate
        id: package
        run: |
          release_dir=$(mktemp -d "$RUNNER_TEMP/slint-webos-release.XXXXXX")
          mkdir "$release_dir/cargo"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -v "$release_dir:/release" \
            -e CARGO_HOME=/release/cargo -e CCACHE_DIR=/release/ccache \
            slint-webos-build bash .github/scripts/prepare-release.sh "$CRATE_VERSION" /release
          printf 'directory=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"
      - name: Cross-build a consumer of the packaged crate offline
        env:
          RELEASE_DIR: ${{ steps.package.outputs.directory }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$RELEASE_DIR:/release" -e CARGO_HOME=/release/cargo -e CCACHE_DIR=/release/ccache \
            -e CARGO_NET_OFFLINE=true -e CRATE_VERSION -w /release/app slint-webos-build bash -euc '
              cargo build --locked --release --target armv7-unknown-linux-gnueabi
              python3 "/release/slint-webos-$CRATE_VERSION/tools/verify_elf.py" \
                target/armv7-unknown-linux-gnueabi/release/slint-webos-release-check
            '
      - name: Publish to crates.io
        if: github.event_name == 'push'
        env:
          RELEASE_DIR: ${{ steps.package.outputs.directory }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -v "$RELEASE_DIR:/release" -e CARGO_HOME=/release/cargo \
            -e CARGO_REGISTRY_TOKEN slint-webos-build \
            cargo publish --locked --allow-dirty --no-verify --target armv7-unknown-linux-gnueabi
