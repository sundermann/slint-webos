name: Check Slint webOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install SDL, Mesa, and system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev xvfb xauth libgl1-mesa-dri fontconfig fonts-dejavu-core
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
      - name: Exercise the SDL OpenGL ES backend
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' env \
            SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 SLINT_WEBOS_GPU_TEST=1 \
            cargo test --locked --test backend

  webos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t slint-webos-build .
      - run: docker run --rm -v "$PWD:/work" slint-webos-build
      - name: Verify ELF and package IPK
        run: |
          docker run --rm -v "$PWD:/work" slint-webos-build \
            python3 tools/package.py \
            --binary target/armv7-unknown-linux-gnueabi/release/examples/counter \
            --appinfo examples/webos/appinfo.json --icon examples/webos/icon.png
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: slint-webos-counter
          path: dist/*.ipk
          if-no-files-found: error
